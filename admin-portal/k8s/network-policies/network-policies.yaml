metadata:
  name: keycloak-network-policy
  namespace: social-protection
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from admin-portal
    - from:
        - podSelector:
            matchLabels:
              app: admin-portal
      ports:
        - protocol: TCP
          port: 8080
    # Allow from APISIX (for token validation)
    - from:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 8080
    # Allow inter-cluster communication
    - from:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800
  egress:
    # Allow to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow inter-cluster communication
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 7800
        - protocol: TCP
          port: 57800
