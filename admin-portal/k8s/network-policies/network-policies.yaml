              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow to APISIX
    - to:
        - podSelector:
            matchLabels:
              app: apisix
      ports:
        - protocol: TCP
          port: 9080
