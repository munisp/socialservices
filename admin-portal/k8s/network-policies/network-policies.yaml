---
# Dapr System Components
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dapr-network-policy
  namespace: dapr-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: dapr
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from application pods
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: social-protection
      ports:
        - protocol: TCP
          port: 50001
        - protocol: TCP
          port: 50002
        - protocol: TCP
          port: 6050
    # Allow inter-component communication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: dapr
      ports:
        - protocol: TCP
          port: 50001
        - protocol: TCP
          port: 50002
        - protocol: TCP
          port: 6050
  egress:
    # Allow to application namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: social-protection
      ports:
        - protocol: TCP
          port: 3500
    # Allow inter-component communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: dapr
      ports:
        - protocol: TCP
          port: 50001
        - protocol: TCP
          port: 50002
---
# Pod Security Admission Labels for Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: social-protection
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
