# OpenLane GRC Platform Deployment
# Provides compliance automation, evidence collection, and audit management
---
apiVersion: v1
kind: Namespace
metadata:
  name: openlane
  labels:
    app.kubernetes.io/name: openlane
    app.kubernetes.io/component: grc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openlane-config
  namespace: openlane
data:
  OPENLANE_SERVER_HOST: "0.0.0.0"
  OPENLANE_SERVER_PORT: "17608"
  OPENLANE_SERVER_DEBUG: "false"
  OPENLANE_DB_HOST: "postgres-openlane"
  OPENLANE_DB_PORT: "5432"
  OPENLANE_DB_NAME: "openlane"
  OPENLANE_DB_SSLMODE: "require"
  OPENLANE_REDIS_HOST: "redis-openlane"
  OPENLANE_REDIS_PORT: "6379"
  OPENLANE_FGA_HOST: "openfga"
  OPENLANE_FGA_PORT: "8080"
  OPENLANE_OIDC_ISSUER: "https://keycloak.social-protection.svc.cluster.local/realms/social-protection"
  OPENLANE_OIDC_CLIENT_ID: "openlane"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openlane-secrets
  namespace: openlane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openlane-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: social-protection/openlane
        property: db-password
    - secretKey: redis-password
      remoteRef:
        key: social-protection/openlane
        property: redis-password
    - secretKey: session-secret
      remoteRef:
        key: social-protection/openlane
        property: session-secret
    - secretKey: api-key
      remoteRef:
        key: social-protection/openlane
        property: api-key
    - secretKey: oidc-client-secret
      remoteRef:
        key: social-protection/openlane
        property: oidc-client-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlane
  namespace: openlane
  labels:
    app: openlane
    app.kubernetes.io/name: openlane
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openlane
  template:
    metadata:
      labels:
        app: openlane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "17608"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: openlane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: openlane
          image: ghcr.io/theopenlane/core:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 17608
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openlane-config
          env:
            - name: OPENLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: db-password
            - name: OPENLANE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: redis-password
            - name: OPENLANE_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: session-secret
            - name: OPENLANE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: oidc-client-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openlane-config
---
apiVersion: v1
kind: Service
metadata:
  name: openlane
  namespace: openlane
  labels:
    app: openlane
spec:
  type: ClusterIP
  ports:
    - port: 17608
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: openlane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openlane
  namespace: openlane
---
# OpenLane Bridge - Consumes platform events and creates evidence/tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlane-bridge
  namespace: openlane
  labels:
    app: openlane-bridge
    app.kubernetes.io/name: openlane-bridge
    app.kubernetes.io/component: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openlane-bridge
  template:
    metadata:
      labels:
        app: openlane-bridge
    spec:
      serviceAccountName: openlane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bridge
          image: social-protection/orchestrator:latest
          imagePullPolicy: Always
          command: ["./orchestrator", "openlane-bridge"]
          env:
            - name: OPENLANE_API_URL
              value: "http://openlane.openlane.svc.cluster.local:17608"
            - name: OPENLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: api-key
            - name: KAFKA_BROKERS
              value: "kafka.social-protection.svc.cluster.local:9092"
            - name: OPENLANE_KAFKA_TOPICS
              value: "platform.events,beneficiary.events,disbursement.events,grievance.events,fraud.events,audit.events"
            - name: OPENLANE_CONSUMER_GROUP
              value: "openlane-bridge"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# PostgreSQL for OpenLane
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-openlane
  namespace: openlane
spec:
  serviceName: postgres-openlane
  replicas: 1
  selector:
    matchLabels:
      app: postgres-openlane
  template:
    metadata:
      labels:
        app: postgres-openlane
    spec:
      securityContext:
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: openlane
            - name: POSTGRES_USER
              value: openlane
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: encrypted-gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-openlane
  namespace: openlane
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-openlane
---
# Redis for OpenLane
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-openlane
  namespace: openlane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-openlane
  template:
    metadata:
      labels:
        app: redis-openlane
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --appendonly
            - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openlane-secrets
                  key: redis-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-openlane
  namespace: openlane
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis-openlane
---
# Ingress for OpenLane
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openlane
  namespace: openlane
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - grc.social-protection.example.com
      secretName: openlane-tls
  rules:
    - host: grc.social-protection.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openlane
                port:
                  number: 17608
