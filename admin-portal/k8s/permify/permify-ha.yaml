apiVersion: v1
kind: Secret
metadata:
  name: permify-secret
  namespace: social-protection
type: Opaque
stringData:
  db-password: "permify-db-password-change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: permify-config
  namespace: social-protection
data:
  config.yaml: |
    server:
      http:
        enabled: true
        port: 3476
      grpc:
        port: 3478
      
    logger:
      level: info
      output: stdout
      
    profiler:
      enabled: false
      
    authn:
      enabled: false
      
    tracer:
      enabled: false
      
    meter:
      enabled: true
      
    service:
      circuit_breaker: true
      watch:
        enabled: true
      schema:
        cache:
          number_of_counters: 1000
          max_cost: 10MiB
      permission:
        bulk_limit: 100
        concurrency_limit: 100
      relationship:
        enabled: true
---
apiVersion: v1
kind: Service
metadata:
  name: permify-db-headless
  namespace: social-protection
  labels:
    app: permify-db
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: permify-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: permify-db
  namespace: social-protection
spec:
  serviceName: permify-db-headless
  replicas: 3
  selector:
    matchLabels:
      app: permify-db
  template:
    metadata:
      labels:
        app: permify-db
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - permify-db
            topologyKey: kubernetes.io/hostname
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: permify
        - name: POSTGRES_USER
          value: permify
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secret
              key: db-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - permify
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - permify
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: permify
  namespace: social-protection
  labels:
    app: permify
spec:
  ports:
  - port: 3476
    name: http
  - port: 3478
    name: grpc
  selector:
    app: permify
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permify
  namespace: social-protection
spec:
  replicas: 3
  selector:
    matchLabels:
      app: permify
  template:
    metadata:
      labels:
        app: permify
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - permify
              topologyKey: kubernetes.io/hostname
      containers:
      - name: permify
        image: ghcr.io/permify/permify:v0.8.4
        args:
        - serve
        ports:
        - containerPort: 3476
          name: http
        - containerPort: 3478
          name: grpc
        env:
        - name: PERMIFY_DATABASE_ENGINE
          value: postgres
        - name: PERMIFY_DATABASE_URI
          value: "postgres://permify:$(DB_PASSWORD)@permify-db-0.permify-db-headless:5432/permify?sslmode=disable"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: permify-secret
              key: db-password
        - name: PERMIFY_LOG_LEVEL
          value: info
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/permify
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3476
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3476
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: config
        configMap:
          name: permify-config
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-pdb
  namespace: social-protection
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: permify-db-pdb
  namespace: social-protection
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: permify-db
