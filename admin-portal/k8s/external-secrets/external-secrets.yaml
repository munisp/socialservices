# External Secrets Configuration
# Integrates with HashiCorp Vault, AWS Secrets Manager, GCP Secret Manager, Azure Key Vault
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "social-protection"
          serviceAccountRef:
            name: "external-secrets-sa"
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: "external-secrets-sa"
---
# Keycloak Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-secrets
  namespace: social-protection
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-password
      remoteRef:
        key: social-protection/keycloak
        property: admin-password
    - secretKey: db-password
      remoteRef:
        key: social-protection/keycloak
        property: db-password
    - secretKey: client-secret
      remoteRef:
        key: social-protection/keycloak
        property: client-secret
---
