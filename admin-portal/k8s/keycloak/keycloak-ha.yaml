apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: social-protection
type: Opaque
stringData:
  admin-password: "keycloak-admin-password-change-me"
  db-password: "keycloak-db-password-change-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
  namespace: social-protection
data:
  KC_CACHE: "ispn"
  KC_CACHE_STACK: "kubernetes"
  KC_HEALTH_ENABLED: "true"
  KC_METRICS_ENABLED: "true"
  KC_HTTP_ENABLED: "true"
  KC_HOSTNAME_STRICT: "false"
  KC_PROXY: "edge"
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db-headless
  namespace: social-protection
  labels:
    app: keycloak-db
spec:
  ports:
  - port: 5432
    name: postgres
  clusterIP: None
  selector:
    app: keycloak-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
  namespace: social-protection
spec:
  serviceName: keycloak-db-headless
  replicas: 3
  selector:
    matchLabels:
      app: keycloak-db
  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - keycloak-db
            topologyKey: kubernetes.io/hostname
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: keycloak
        - name: POSTGRES_USER
          value: keycloak
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: db-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - keycloak
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - keycloak
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-headless
  namespace: social-protection
  labels:
    app: keycloak
spec:
  ports:
  - port: 8080
    name: http
  - port: 7800
    name: jgroups
  clusterIP: None
  selector:
    app: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: social-protection
  labels:
    app: keycloak
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    name: http
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: social-protection
spec:
  serviceName: keycloak-headless
  replicas: 3
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - keycloak
            topologyKey: kubernetes.io/hostname
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:23.0
        args:
        - start
        - --cache=ispn
        - --cache-stack=kubernetes
        - --http-enabled=true
        - --hostname-strict=false
        - --proxy=edge
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 7800
          name: jgroups
        env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: admin-password
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://keycloak-db-0.keycloak-db-headless:5432/keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secret
              key: db-password
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: JAVA_OPTS_APPEND
          value: "-Djgroups.dns.query=keycloak-headless.social-protection.svc.cluster.local"
        - name: jgroups.dns.query
          value: keycloak-headless.social-protection.svc.cluster.local
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 5
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-pdb
  namespace: social-protection
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: keycloak
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak-db-pdb
  namespace: social-protection
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: keycloak-db
