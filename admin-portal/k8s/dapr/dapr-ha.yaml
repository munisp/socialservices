apiVersion: v1
kind: Namespace
metadata:
  name: dapr-system
  labels:
    app.kubernetes.io/name: dapr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dapr-config
  namespace: dapr-system
data:
  config.yaml: |
    apiVersion: dapr.io/v1alpha1
    kind: Configuration
    metadata:
      name: dapr-config
    spec:
      tracing:
        samplingRate: "1"
        zipkin:
          endpointAddress: "http://zipkin.observability:9411/api/v2/spans"
      metric:
        enabled: true
      mtls:
        enabled: true
        workloadCertTTL: "24h"
        allowedClockSkew: "15m"
      accessControl:
        defaultAction: allow
        trustDomain: "social-protection"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-operator
  namespace: dapr-system
  labels:
    app: dapr-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dapr-operator
  template:
    metadata:
      labels:
        app: dapr-operator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dapr-operator
              topologyKey: kubernetes.io/hostname
      serviceAccountName: dapr-operator
      containers:
      - name: dapr-operator
        image: daprio/dapr:1.12.4
        args:
        - --operator
        - --log-level
        - info
        - --log-as-json
        - --enable-metrics
        - --metrics-port
        - "9090"
        ports:
        - containerPort: 6500
          name: api
        - containerPort: 9090
          name: metrics
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-sidecar-injector
  namespace: dapr-system
  labels:
    app: dapr-sidecar-injector
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dapr-sidecar-injector
  template:
    metadata:
      labels:
        app: dapr-sidecar-injector
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dapr-sidecar-injector
              topologyKey: kubernetes.io/hostname
      serviceAccountName: dapr-injector
      containers:
      - name: dapr-sidecar-injector
        image: daprio/dapr:1.12.4
        args:
        - --injector
        - --log-level
        - info
        - --log-as-json
        - --enable-metrics
        - --metrics-port
        - "9090"
        ports:
        - containerPort: 4000
          name: https
        - containerPort: 9090
          name: metrics
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SIDECAR_IMAGE
          value: "daprio/daprd:1.12.4"
        - name: SIDECAR_IMAGE_PULL_POLICY
          value: "IfNotPresent"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-placement
  namespace: dapr-system
  labels:
    app: dapr-placement
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dapr-placement
  template:
    metadata:
      labels:
        app: dapr-placement
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dapr-placement
              topologyKey: kubernetes.io/hostname
      serviceAccountName: dapr-placement
      containers:
      - name: dapr-placement
        image: daprio/dapr:1.12.4
        args:
        - --placement
        - --log-level
        - info
        - --log-as-json
        - --enable-metrics
        - --metrics-port
        - "9090"
        - --replicationFactor
        - "100"
        ports:
        - containerPort: 50005
          name: api
        - containerPort: 8201
          name: raft
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapr-sentry
  namespace: dapr-system
  labels:
    app: dapr-sentry
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dapr-sentry
  template:
    metadata:
      labels:
        app: dapr-sentry
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dapr-sentry
              topologyKey: kubernetes.io/hostname
      serviceAccountName: dapr-sentry
      containers:
      - name: dapr-sentry
        image: daprio/dapr:1.12.4
        args:
        - --sentry
        - --log-level
        - info
        - --log-as-json
        - --enable-metrics
        - --metrics-port
        - "9090"
        - --trust-domain
        - social-protection
        ports:
        - containerPort: 50001
          name: grpc
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-api
  namespace: dapr-system
spec:
  ports:
  - port: 80
    targetPort: 6500
    name: api
  selector:
    app: dapr-operator
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-sidecar-injector
  namespace: dapr-system
spec:
  ports:
  - port: 443
    targetPort: 4000
    name: https
  selector:
    app: dapr-sidecar-injector
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-placement-server
  namespace: dapr-system
spec:
  ports:
  - port: 50005
    name: api
  - port: 8201
    name: raft
  selector:
    app: dapr-placement
---
apiVersion: v1
kind: Service
metadata:
  name: dapr-sentry
  namespace: dapr-system
spec:
  ports:
  - port: 50001
    name: grpc
  selector:
    app: dapr-sentry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-operator
  namespace: dapr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-injector
  namespace: dapr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-placement
  namespace: dapr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dapr-sentry
  namespace: dapr-system
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dapr-operator-pdb
  namespace: dapr-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dapr-operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dapr-sidecar-injector-pdb
  namespace: dapr-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dapr-sidecar-injector
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dapr-placement-pdb
  namespace: dapr-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: dapr-placement
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: social-protection
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: redis.social-protection.svc.cluster.local:6379
  - name: redisPassword
    secretKeyRef:
      name: redis-secret
      key: redis-password
  - name: actorStateStore
    value: "true"
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: social-protection
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: kafka.social-protection.svc.cluster.local:9092
  - name: consumerGroup
    value: social-protection-group
  - name: authRequired
    value: "false"
