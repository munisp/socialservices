version: '3.8'

services:
  # Delta Lake Service
  deltalake-service:
    build:
      context: ./python-services
      dockerfile: Dockerfile.deltalake
    ports:
      - "5001:5001"
    environment:
      - S3_ENDPOINT=http://rustfs:9000
      - S3_ACCESS_KEY=rustfsadmin
      - S3_SECRET_KEY=rustfsadmin
      - S3_BUCKET=lakehouse
    depends_on:
      - rustfs
    networks:
      - lakehouse

  # OCR Service
  ocr-service:
    build: ./python-services/ocr-service
    ports:
      - "5002:5002"
    networks:
      - lakehouse

  # Biometric Service
  biometric-service:
    build: ./python-services/biometric-service
    ports:
      - "5003:5003"
    networks:
      - lakehouse

  # DataFusion Service
  datafusion-service:
    build: ./python-services/datafusion-service
    ports:
      - "5004:5004"
    depends_on:
      - deltalake-service
    networks:
      - lakehouse

  # Ray Service
  ray-service:
    build:
      context: .
      dockerfile: python-services/ray-service/Dockerfile
    ports:
      - "5005:5005"
    environment:
      - RAY_ADDRESS=local
    volumes:
      - ./data:/data:ro
      - ./model-registry:/registry
    networks:
      - lakehouse

  # Sedona Service
  sedona-service:
    build: ./python-services/sedona-service
    ports:
      - "5006:5006"
    networks:
      - lakehouse

  # RustFS (S3-compatible storage - 2.3x faster than MinIO)
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ROOT_USER=rustfsadmin
      - RUSTFS_ROOT_PASSWORD=rustfsadmin
      - RUSTFS_BROWSER=on
    command: server /data --console-address ":9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lakehouse

  # MinIO Backup (kept for rollback)
  # Uncomment to enable MinIO as fallback
  # minio:
  #   image: minio/minio:latest
  #   ports:
  #     - "9010:9000"
  #     - "9002:9001"
  #   environment:
  #     - MINIO_ROOT_USER=minioadmin
  #     - MINIO_ROOT_PASSWORD=minioadmin
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio-data:/data
  #   networks:
  #     - lakehouse

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - lakehouse

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - lakehouse

  # Flink JobManager
  flink-jobmanager:
    image: flink:1.18
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    networks:
      - lakehouse

  # Flink TaskManager
  flink-taskmanager:
    image: flink:1.18
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    depends_on:
      - flink-jobmanager
    deploy:
      replicas: 2
    networks:
      - lakehouse

  # Spark Master
  spark-master:
    image: bitnami/spark:3.5
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
    networks:
      - lakehouse

  # Spark Worker
  spark-worker:
    image: bitnami/spark:3.5
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    deploy:
      replicas: 3
    networks:
      - lakehouse

networks:
  lakehouse:
    driver: bridge

volumes:
  rustfs-data:
  minio-data:  # Kept for rollback
