version: "3.8"

services:
  # Redis - Caching & Session Management
  redis:
    image: redis:7.2-alpine
    container_name: admin-portal-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - middleware
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # APISIX - API Gateway
  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: admin-portal-apisix
    restart: always
    volumes:
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
    depends_on:
      - etcd
    ports:
      - "9080:9080"   # Gateway HTTP
      - "9180:9180"   # Admin API
      - "9443:9443"   # Gateway HTTPS
    networks:
      - middleware
    environment:
      - APISIX_STAND_ALONE=false

  # etcd - APISIX Configuration Store
  etcd:
    image: bitnami/etcd:3.5.12
    container_name: admin-portal-etcd
    restart: always
    environment:
      ETCD_ENABLE_V2: "true"
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/bitnami/etcd
    networks:
      - middleware

  # APISIX Dashboard
  apisix-dashboard:
    image: apache/apisix-dashboard:3.0.1-alpine
    container_name: admin-portal-apisix-dashboard
    restart: always
    ports:
      - "9000:9000"
    networks:
      - middleware
    environment:
      - APISIX_API_BASE_URL=http://apisix:9180/apisix/admin

  # Kafka - Event Streaming
  kafka:
    image: bitnami/kafka:3.6
    container_name: admin-portal-kafka
    restart: always
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - middleware
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: admin-portal-kafka-ui
    restart: always
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - middleware

  # Keycloak - Identity & SSO
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: admin-portal-keycloak
    restart: always
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak123}
      - KC_HOSTNAME=localhost
      - KC_HTTP_ENABLED=true
    ports:
      - "8081:8080"
    depends_on:
      - keycloak-db
    networks:
      - middleware
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Keycloak Database
  keycloak-db:
    image: postgres:16-alpine
    container_name: admin-portal-keycloak-db
    restart: always
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:-keycloak123}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks:
      - middleware

  # Permify - Authorization
  permify:
    image: ghcr.io/permify/permify:latest
    container_name: admin-portal-permify
    restart: always
    command: serve
    environment:
      - PERMIFY_DATABASE_ENGINE=postgres
      - PERMIFY_DATABASE_URI=postgres://permify:${PERMIFY_DB_PASSWORD:-permify123}@permify-db:5432/permify?sslmode=disable
      - PERMIFY_AUTHN_ENABLED=false
    ports:
      - "3476:3476"   # HTTP
      - "3478:3478"   # gRPC
    depends_on:
      - permify-db
    networks:
      - middleware
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3476/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Permify Database
  permify-db:
    image: postgres:16-alpine
    container_name: admin-portal-permify-db
    restart: always
    environment:
      - POSTGRES_DB=permify
      - POSTGRES_USER=permify
      - POSTGRES_PASSWORD=${PERMIFY_DB_PASSWORD:-permify123}
    volumes:
      - permify-db-data:/var/lib/postgresql/data
    networks:
      - middleware

  # Temporal - Workflow Orchestration
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: admin-portal-temporal
    restart: always
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-temporal123}
      - POSTGRES_SEEDS=temporal-db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"   # gRPC
    depends_on:
      - temporal-db
    networks:
      - middleware
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Temporal Database
  temporal-db:
    image: postgres:16-alpine
    container_name: admin-portal-temporal-db
    restart: always
    environment:
      - POSTGRES_DB=temporal
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD:-temporal123}
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - middleware

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: admin-portal-temporal-ui
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8082:8080"
    depends_on:
      - temporal
    networks:
      - middleware

volumes:
  redis-data:
  etcd-data:
  kafka-data:
  keycloak-db-data:
  permify-db-data:
  temporal-db-data:

networks:
  middleware:
    driver: bridge
