[package]
name = "storage-gateway"
version = "0.1.0"
edition = "2021"
description = "High-performance S3-compatible storage gateway for social protection platform"
authors = ["Social Protection Platform Team"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# AWS S3 SDK (works with RustFS/MinIO)
aws-sdk-s3 = "1.12"
aws-config = "1.1"
aws-credential-types = "1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"
lazy_static = "1.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Health checks
tokio-stream = "0.1"

# Multipart upload handling
multer = "3.0"

# Mime types
mime = "0.3"
mime_guess = "2.0"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.9"

[[bin]]
name = "storage-gateway"
path = "src/main.rs"
