apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: ml-document-service
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisPassword
    value: ""
---
apiVersion: dapr.io/v1alpha1
kind: Subscription
metadata:
  name: ml-service-subscription
spec:
  topic: document.validation.requested
  route: /validate
  pubsubname: pubsub
