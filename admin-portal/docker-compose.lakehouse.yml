version: '3.8'

services:
  # ========================================
  # Delta Lake Python Service
  # ========================================
  deltalake-service:
    build:
      context: ./python-services
      dockerfile: Dockerfile.deltalake
    container_name: deltalake-service
    ports:
      - "5001:5001"
    environment:
      - S3_ENDPOINT=http://rustfs:9000
      - AWS_ACCESS_KEY=rustfsadmin
      - AWS_SECRET_KEY=rustfsadmin
      - AWS_REGION=us-east-1
      - LAKEHOUSE_PATH=s3://lakehouse
    volumes:
      - ./python-services:/app
    networks:
      - lakehouse
    depends_on:
      - rustfs

  # ========================================
  # RustFS (S3-compatible storage - 2.3x faster than MinIO)
  # ========================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ROOT_USER=rustfsadmin
      - RUSTFS_ROOT_PASSWORD=rustfsadmin
      - RUSTFS_BROWSER=on
    command: server /data --console-address ":9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lakehouse

  # ========================================
  # MinIO Backup (kept for rollback)
  # ========================================
  # Uncomment to enable MinIO as fallback
  # minio:
  #   image: minio/minio:latest
  #   container_name: minio
  #   ports:
  #     - "9010:9000"
  #     - "9002:9001"
  #   environment:
  #     - MINIO_ROOT_USER=minioadmin
  #     - MINIO_ROOT_PASSWORD=minioadmin
  #   command: server /data --console-address ":9001"
  #   volumes:
  #     - minio-data:/data
  #   networks:
  #     - lakehouse

  # ========================================
  # Apache Flink Cluster
  # ========================================
  flink-jobmanager:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-jobmanager
    ports:
      - "8081:8081"  # Web UI
      - "6123:6123"  # RPC
    command: jobmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend: rocksdb
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
    volumes:
      - flink-jobmanager-data:/tmp
      - ./flink-jobs:/opt/flink/jobs
    networks:
      - lakehouse

  flink-taskmanager-1:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-taskmanager-1
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 4096m
    volumes:
      - flink-taskmanager-1-data:/tmp
    networks:
      - lakehouse

  flink-taskmanager-2:
    image: flink:1.18-scala_2.12-java11
    container_name: flink-taskmanager-2
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 4096m
    volumes:
      - flink-taskmanager-2-data:/tmp
    networks:
      - lakehouse

  # ========================================
  # Apache Spark Cluster
  # ========================================
  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"  # Web UI
      - "7077:7077"  # Master RPC
    volumes:
      - spark-master-data:/opt/bitnami/spark/work
      - ./spark-jobs:/opt/spark-jobs
    networks:
      - lakehouse

  spark-worker-1:
    image: bitnami/spark:3.5
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=4
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - spark-worker-1-data:/opt/bitnami/spark/work
    networks:
      - lakehouse

  spark-worker-2:
    image: bitnami/spark:3.5
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=4
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - spark-worker-2-data:/opt/bitnami/spark/work
    networks:
      - lakehouse

  spark-worker-3:
    image: bitnami/spark:3.5
    container_name: spark-worker-3
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=4
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
    depends_on:
      - spark-master
    volumes:
      - spark-worker-3-data:/opt/bitnami/spark/work
    networks:
      - lakehouse

  # ========================================
  # Kafka (for streaming events)
  # ========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - lakehouse

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - lakehouse

volumes:
  rustfs-data:
  minio-data:  # Kept for rollback
  flink-jobmanager-data:
  flink-taskmanager-1-data:
  flink-taskmanager-2-data:
  spark-master-data:
  spark-worker-1-data:
  spark-worker-2-data:
  spark-worker-3-data:

networks:
  lakehouse:
    driver: bridge
