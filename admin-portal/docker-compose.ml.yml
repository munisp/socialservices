services:
  mlflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD}
    volumes:
      - mlflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql://mlflow:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/mlflow", "--artifacts-destination", "/mlartifacts"]
    ports: ["5000:5000"]
    volumes: ["mlflow-artifacts:/mlartifacts"]
    depends_on:
      mlflow-db:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    ports: ["7474:7474", "7687:7687"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    volumes: ["neo4j-data:/data"]

  ray-service:
    build:
      context: .
      dockerfile: python-services/ray-service/Dockerfile
    ports: ["5005:5005"]
    volumes: ["./data:/data:ro", "./model-registry:/registry"]

volumes:
  mlflow-db:
  mlflow-artifacts:
  neo4j-data:
